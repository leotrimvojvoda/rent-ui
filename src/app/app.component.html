<p-toast key="global" />
<p-confirmDialog />
@if (loadingService.isLoading()) {
    <!-- Decorative: every page announces its own loading state through its
         skeletons, so a progressbar role here would narrate each request twice. -->
    <div aria-hidden="true">
        <p-progressbar mode="indeterminate" [style]="{ position: 'fixed', top: 0, left: 0, width: '100%', 'z-index': 9999, height: '3px' }" />
    </div>
}
<router-outlet></router-outlet>
