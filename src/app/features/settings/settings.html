<div class="card">
    <div class="font-semibold text-xl mb-6">Settings</div>

    <div class="flex flex-col gap-6 max-w-lg">

        <!-- Appearance -->
        <div>
            <div class="font-medium text-lg mb-4">Appearance</div>
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block font-medium mb-2">Theme</label>
                    <p-selectbutton
                        [options]="themeOptions"
                        [ngModel]="selectedTheme"
                        (ngModelChange)="onThemeChange($event)"
                        optionLabel="label"
                        optionValue="value">
                        <ng-template #item let-opt>
                            <i [class]="opt.icon" class="mr-2"></i>{{ opt.label }}
                        </ng-template>
                    </p-selectbutton>
                </div>
                <app-configurator style="display: block; position: static; width: auto; border: none; box-shadow: none; padding: 0; background: transparent;" />
            </div>
        </div>


    </div>
</div>
