<app-auth-card heading="Welcome back" subheading="Sign in to manage your rentals.">
    @if (notice()) {
    <p-message severity="success" [text]="notice()!" styleClass="w-full mb-5" />
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label for="email" class="block text-color font-medium text-sm mb-2">Email</label>
        <input pInputText id="email" type="email" autocomplete="email" placeholder="you@example.com" class="w-full" formControlName="email" />
        <app-field-error [control]="form.controls.email" [messages]="{ required: 'Enter your email address.' }" />

        <label for="password" class="block text-color font-medium text-sm mb-2 mt-4">Password</label>
        <p-password inputId="password" formControlName="password" placeholder="Your password" [toggleMask]="true" [fluid]="true" [feedback]="false" />
        <app-field-error [control]="form.controls.password" [messages]="{ required: 'Enter your password.' }" />

        @if (countdown.active()) {
        <p-message severity="warn" styleClass="w-full mt-4" [text]="'Too many attempts. Try again in ' + countdown.label() + '.'" />
        } @else if (formError()) {
        <p-message severity="error" [text]="formError()!" styleClass="w-full mt-4" />
        }

        <button type="submit" class="keyway-cta w-full mt-6" [disabled]="loading() || countdown.active()">{{ loading() ? 'Signing in…' : 'Sign in' }}</button>
    </form>

    <div class="mt-4 text-center">
        <a routerLink="/auth/forgot-password" class="text-sm text-primary font-medium no-underline">Forgot your password?</a>
    </div>

    <div class="mt-6 pt-6 border-t border-surface text-center text-sm">
        <span class="text-muted-color">Don't have an account?</span>
        <a routerLink="/auth/register" class="font-semibold no-underline ml-1.5 text-primary">Create one</a>
    </div>
    <div class="mt-2 text-center">
        <a routerLink="/cars" class="text-muted-color text-sm no-underline hover:text-color">Browse cars without an account</a>
    </div>
</app-auth-card>
