@if (submitted()) {
<app-auth-card heading="Check your email" subheading="If that address has an account, a 6-digit reset code is on its way to it.">
    <p class="text-sm text-muted-color text-center m-0 mb-6">Sent to <span class="font-medium text-color">{{ email }}</span></p>

    <a [routerLink]="['/auth/reset-password']" [queryParams]="{ email: email }" class="keyway-cta w-full no-underline">Enter the code</a>

    <div class="mt-6 pt-6 border-t border-surface text-center text-sm">
        <a routerLink="/auth/login" class="text-muted-color no-underline hover:text-color">Back to sign in</a>
    </div>
</app-auth-card>
} @else {
<app-auth-card heading="Reset your password" subheading="We'll email you a code to set a new one.">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label for="email" class="block text-color font-medium text-sm mb-2">Email</label>
        <input pInputText id="email" type="email" autocomplete="email" placeholder="you@example.com" class="w-full" formControlName="email" />
        <app-field-error [control]="form.controls.email" [messages]="{ required: 'Enter your email address.' }" />

        @if (countdown.active()) {
        <p-message severity="warn" styleClass="w-full mt-4" [text]="'Too many attempts. Try again in ' + countdown.label() + '.'" />
        } @else if (formError()) {
        <p-message severity="error" [text]="formError()!" styleClass="w-full mt-4" />
        }

        <button type="submit" class="keyway-cta w-full mt-6" [disabled]="loading() || countdown.active()">{{ loading() ? 'Sending…' : 'Send reset code' }}</button>
    </form>

    <div class="mt-6 pt-6 border-t border-surface text-center text-sm">
        <span class="text-muted-color">Already have a code?</span>
        <a routerLink="/auth/reset-password" class="font-semibold no-underline ml-1.5 text-primary">Enter it</a>
    </div>
    <div class="mt-2 text-center text-sm">
        <a routerLink="/auth/login" class="text-muted-color no-underline hover:text-color">Back to sign in</a>
    </div>
</app-auth-card>
}
